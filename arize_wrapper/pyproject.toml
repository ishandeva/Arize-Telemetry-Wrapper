[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arize-telemetry-wrapper"
version = "0.1.0"
description = "Organization-standard Arize telemetry for ML and LLM applications"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [{name = "Your Organization"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
llm = [
    "arize-otel>=0.7",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
ml = [
    "arize>=7.0",
    "pandas>=1.5",
]
test = [
    "pytest>=7",
    "opentelemetry-sdk>=1.24",
]
dev = [
    "build>=1.0",
    "pytest>=7",
    "twine>=5.0",
]

[project.urls]
Documentation = "https://replace-with-your-internal-docs.example/arize-telemetry-wrapper"
Repository = "https://replace-with-your-source-control.example/arize-telemetry-wrapper"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arize_wrapper*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
